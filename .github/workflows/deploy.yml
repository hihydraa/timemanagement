name: Deploy
# deploy ขึ้น Cloudflare ด้วยมือเท่านั้น (Actions → Deploy → Run workflow เลือก branch ที่ต้องการ)
# ต้องตั้งค่าใน Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN (สิทธิ์ Workers Scripts/D1/R2 Edit), CLOUDFLARE_ACCOUNT_ID
#   Variables: D1_DATABASE_ID, APP_BASE_URL (https://...workers.dev), CONTACT_EMAIL (ไม่บังคับ)
# secrets ของแอป (LINE/Google/SESSION ฯลฯ) ตั้งไว้ที่ Worker แล้ว ไม่ต้องใส่ที่นี่
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'รัน D1 migration บน production ก่อน deploy (เปลี่ยน schema ของข้อมูลจริง เลือกเฉพาะเมื่อมี migration ใหม่)'
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # โมเดล 3D (.glb) เก็บใน Git LFS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # wrangler.toml ในรีโปเป็นค่าตัวอย่าง: สร้างสำเนาที่ใส่ค่าจริงของ production (ไม่ commit)
      - name: Prepare production config
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          test -n "$D1_DATABASE_ID" && test -n "$APP_BASE_URL" || { echo "ตั้ง Variables D1_DATABASE_ID และ APP_BASE_URL ก่อน"; exit 1; }
          sed -e "s#^database_id = .*#database_id = \"$D1_DATABASE_ID\"#" \
              -e "s#^APP_BASE_URL = .*#APP_BASE_URL = \"$APP_BASE_URL\"#" \
              -e "s#^CONTACT_EMAIL = .*#CONTACT_EMAIL = \"$CONTACT_EMAIL\"#" \
              wrangler.toml > wrangler.prod.toml
          WRANGLER_CONFIG=wrangler.prod.toml node scripts/predeploy-check.mjs

      - name: Apply D1 migrations
        if: ${{ inputs.migrate }}
        run: npx wrangler d1 migrations apply dobby --remote -c wrangler.prod.toml

      - name: Deploy
        run: npx wrangler deploy -c wrangler.prod.toml
