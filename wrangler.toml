name = "dobby"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "dobby"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dobby-files"

# Cron ทำงานเป็น UTC — ใช้ */5 ตัวเดียว แล้วเช็คเวลาของผู้ใช้ในโค้ด (ดู docs/DECISIONS.md)
[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_BASE_URL = "http://localhost:5173"
# โควตา push ฟรีต่อเดือนของ LINE OA คุณ (ดูใน OA Manager) — ค่านี้เป็นตัวอย่าง ต้องแก้ให้ตรงของจริง
PUSH_MONTHLY_LIMIT = "200"
MAX_UPLOAD_MB = "10"
USER_STORAGE_QUOTA_MB = "500"
